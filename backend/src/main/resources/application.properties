spring.application.name=backend
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client.id=spring-backend-client
mqtt.topic=sensor/data
mqtt.username=${MQTT_USERNAME:iot_user}
mqtt.password=${MQTT_PASSWORD:iot_password}
influxdb.url=${INFLUXDB_URL:http://localhost:8086}
influxdb.token=${INFLUXDB_TOKEN:my-super-secret-auth-token}
influxdb.org=study_org
influxdb.bucket=study_project
management.influx.metrics.export.enabled=false
logging.level.web=debug
