version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mqtt_broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
    restart: unless-stopped

  influxdb:
    image: influxdb:2.9.1-alpine
    container_name: influxdb
    ports:
      - "8086:8086" # only needed to access from host
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=influx_password
      - DOCKER_INFLUXDB_INIT_ORG=study_org
      - DOCKER_INFLUXDB_INIT_BUCKET=study_project
      - DOCKER_INFLUXDB_INIT_RETENTION=1w     # Automatically sets the 7-day retention!
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    volumes:
      - influxdb-data:/var/lib/influxdb
    restart: unless-stopped

  telegraf:
    image: telegraf:1.40.1-alpine
    container_name: telegraf_agent
    depends_on:
      - mosquitto
      - influxdb
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped

  mock-publisher:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mock_publisher
    depends_on:
      - mosquitto
    command: >
      sh -c "while true; do 
        TEMP=$$((RANDOM % 100)); 
        HUMI=$$((RANDOM % 100)); 
        mosquitto_pub -h mosquitto -t 'sensor/data' -m \"{\\\"temperature\\\": $$TEMP, \\\"humidity\\\": $$HUMI}\" -u \"iot_user\" -P \"iot_password\";
        echo \"Published: $$TEMP, $$HUMI\"; 
        sleep 1; 
      done"

  backend:
    build: ./backend
    container_name: spring_backend
    depends_on:
      - mosquitto
      - influxdb
    ports:
      - "8080:8080"
    environment:
      - MQTT_BROKER_URL=tcp://mosquitto:1883
      - MQTT_USERNAME=iot_user
      - MQTT_PASSWORD=iot_password
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-secret-auth-token
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

volumes:
  influxdb-data:
