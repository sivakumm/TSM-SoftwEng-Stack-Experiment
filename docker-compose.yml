version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mqtt_broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
    restart: unless-stopped

  influxdb:
    image: influxdb:1.13.1-alpine
    container_name: influxdb
    #    ports:
    #      - "8086:8086" # only needed to access from host
    environment:
      - INFLUXDB_DB=study_project
    volumes:
      - influxdb-data:/var/lib/influxdb
    restart: unless-stopped

  telegraf:
    image: telegraf:1.40.1-alpine
    container_name: telegraf_agent
    depends_on:
      - mosquitto
      - influxdb
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped

  influxdb-init:
    image: influxdb:2.9.1-alpine
    container_name: influxdb_init
    depends_on:
      - influxdb
    restart: no # Only runs once at startup
    command: >
      sh -c "apk add --no-cache curl && 
      sleep 5 && 
      curl -s -XPOST 'http://influxdb:8086/query' --data-urlencode 'q=CREATE DATABASE \"study_project\"' &&
      curl -s -XPOST 'http://influxdb:8086/query' --data-urlencode 'q=ALTER RETENTION POLICY \"autogen\" ON \"study_project\" DURATION 7d SHARD DURATION 1d DEFAULT' &&
      echo -e '\nRetention policy applied successfully'"

  mock-publisher:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mock_publisher
    depends_on:
      - mosquitto
    command: >
      sh -c "while true; do 
        TEMP=$$((RANDOM % 100)); 
        mosquitto_pub -h mosquitto -t 'sensor/data' -m \"{\\\"temperature\\\": $$TEMP}\" -u \"iot_user\" -P \"iot_password\";
        echo \"Published: $$TEMP\"; 
        sleep 1; 
      done"

volumes:
  influxdb-data:
